name: Bug report
description: Report a reproducible problem in Lector.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, see [SECURITY.md](https://github.com/Hank-dev/lector/blob/main/SECURITY.md).
        Use a synthetic or public PDF. Do not upload reading history, personal documents, or passwords.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal shareable PDF or instructions for creating one, if possible.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Lector commit, distribution, desktop, Wayland/X11, and output of `pkg-config --modversion gtk4 poppler-glib`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove personal paths and document contents before posting.
