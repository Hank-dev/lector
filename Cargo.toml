[package]
name = "lector"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "A native GTK4 PDF reader and form filler with live Omarchy theming"
repository = "https://github.com/Hank-dev/lector"
readme = "README.md"
keywords = ["pdf", "gtk4", "reader", "omarchy"]
categories = ["gui"]
publish = false
authors = ["hanky"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
poppler = { package = "poppler-rs", version = "0.26", features = ["v25_10"] }
cairo-rs = { version = "0.22", features = ["png"] }
glib = "0.22"
gio = "0.22"
gdk = { package = "gdk4", version = "0.11" }
pango = "0.22"
toml = "1.1"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
